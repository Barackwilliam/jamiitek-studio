{% load i18n static %}{% get_current_language as LANGUAGE_CODE %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JamiiTek AI Marketing Studio{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">{% translate "Skip to main content" %}</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{% url 'core:home' %}">JamiiTek <span>AI Marketing Studio</span></a>
    </div>
  </header>
  <main id="main" class="container site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>&copy; JamiiTek</p>
    </div>
  </footer>
</body>
</html>
