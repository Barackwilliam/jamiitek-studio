{% if form.non_field_errors %}
  <div class="form-errors" role="alert">
    {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
  </div>
{% endif %}
{% for field in form %}
  <div class="field{% if field.errors %} field-invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help" id="{{ field.id_for_label }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
