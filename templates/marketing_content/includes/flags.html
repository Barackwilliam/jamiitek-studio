{% load i18n %}
{% if flags %}
  <div class="warning" role="note">
    <p><strong>{% translate "Check these possible claims:" %}</strong></p>
    <ul>
      {% for flag in flags %}<li>{{ flag.message }} <span class="muted">({{ flag.location }})</span></li>{% endfor %}
    </ul>
  </div>
{% endif %}
